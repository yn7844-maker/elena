name: Collect news
on:
  schedule:
    # UTC -> 한국 시간 07:00 / 08:00 / 09:00 / 10:00 / 11:00 / 15:00 / 18:00 / 21:00.
    # GitHub는 정각을 보장하지 않습니다. 5분 넘게 늦은 시작은 수집 전 실패 처리합니다.
    - cron: '0 0,1,2,6,9,12,22,23 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: news-collection
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund
      - run: npm run collect
        env:
          COLLECTION_TRIGGER: ${{ github.event_name }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NAVER_NEWS_CLIENT_ID: ${{ secrets.NAVER_NEWS_CLIENT_ID }}
          NAVER_NEWS_CLIENT_SECRET: ${{ secrets.NAVER_NEWS_CLIENT_SECRET }}
          NAVER_TREND_CLIENT_ID: ${{ secrets.NAVER_TREND_CLIENT_ID }}
          NAVER_TREND_CLIENT_SECRET: ${{ secrets.NAVER_TREND_CLIENT_SECRET }}
